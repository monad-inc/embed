[project]
name = "monad-embed"
version = "0.1.0"
description = "Mountable /embed backend router (FastAPI) for a Monad embed integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Monad Inc." }]
dependencies = ["fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monad_embed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
